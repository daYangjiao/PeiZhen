# Shared settings
spring.application.name=denglu
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.model
mybatis.configuration.map-underscore-to-camel-case=true

# JPA
spring.jpa.open-in-view=false

# Spring MVC
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.main.allow-bean-definition-overriding=true

# Uploads and logs
app.upload-dir=${APP_UPLOAD_DIR:${user.dir}/uploads}
logging.file.name=${LOGGING_FILE_NAME:${user.dir}/logs/application.log}

# Authentication
jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me-please-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
wechat.mini-app.app-id=${WECHAT_MINI_APP_ID:}
wechat.mini-app.secret=${WECHAT_MINI_APP_SECRET:}
wechat.mobile-app.app-id=${WECHAT_MOBILE_APP_ID:}
wechat.mobile-app.secret=${WECHAT_MOBILE_APP_SECRET:}
wechat.h5.app-id=${WECHAT_H5_APP_ID:}
wechat.h5.secret=${WECHAT_H5_APP_SECRET:}
wechat.h5.redirect-uri=${WECHAT_H5_REDIRECT_URI:}
wechat.web-scan.app-id=${WECHAT_WEB_SCAN_APP_ID:}
wechat.web-scan.secret=${WECHAT_WEB_SCAN_SECRET:}
wechat.web-scan.redirect-uri=${WECHAT_WEB_SCAN_REDIRECT_URI:}
wechat.bind-token-expiration-ms=${WECHAT_BIND_TOKEN_EXPIRATION_MS:600000}

# DeepSeek
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
deepseek.appointment-model=${DEEPSEEK_APPOINTMENT_MODEL:deepseek-v4-flash}
deepseek.thinking-type=${DEEPSEEK_THINKING_TYPE:disabled}
deepseek.reasoning-effort=${DEEPSEEK_REASONING_EFFORT:high}
deepseek.max-tokens=${DEEPSEEK_MAX_TOKENS:1200}

# Logging defaults
logging.level.org.apache.ibatis=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.example.dao=INFO
logging.level.org.apache.ibatis.builder.xml=INFO
logging.level.org.example.service.impl.AiMedicalQaServiceImpl=INFO
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.apache.hc.client5=WARN
