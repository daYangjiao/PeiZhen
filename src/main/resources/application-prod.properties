server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.hikari.data-source-properties.useGeneratedKeys=true
spring.datasource.hikari.data-source-properties.keyColumn=id

spring.jpa.show-sql=false

debug=false
logging.level.org.apache.ibatis=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.com.example.mapper=INFO
logging.level.org.example.dao=INFO
logging.level.org.apache.ibatis.builder.xml=INFO
logging.level.org.example.service.impl.AiMedicalQaServiceImpl=INFO
logging.level.org.springframework.web.client.RestTemplate=INFO
