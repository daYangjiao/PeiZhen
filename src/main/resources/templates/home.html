<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陪诊服务系统</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .welcome-message {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        
        .info-title {
            color: #495057;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .info-content {
            color: #6c757d;
            line-height: 1.5;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            margin: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .timestamp {
            color: #adb5bd;
            font-size: 0.9em;
            margin-top: 30px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .feature-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .feature-icon {
            font-size: 2em;
            margin-bottom: 15px;
        }
        
        .feature-title {
            color: #495057;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .feature-desc {
            color: #6c757d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 陪诊服务系统</h1>
        
        <div class="welcome-message">
            <p th:text="${message}">欢迎使用陪诊服务系统！</p>
            <p>为您提供专业、贴心的陪诊服务体验</p>
        </div>
        
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">📋</div>
                <div class="feature-title">智能导诊</div>
                <div class="feature-desc">两步完成预约流程，智能匹配最适合的陪诊师</div>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">👨‍⚕️</div>
                <div class="feature-title">专业陪诊</div>
                <div class="feature-desc">经验丰富的陪诊师团队，提供全方位陪诊服务</div>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">📱</div>
                <div class="feature-title">便捷管理</div>
                <div class="feature-desc">在线预约、实时跟踪、评价反馈一站式服务</div>
            </div>
        </div>
        
        <div class="info-box">
            <div class="info-title">🚀 快速开始</div>
            <div class="info-content">
                <p>• 访问API文档了解所有接口详情</p>
                <p>• 使用Swagger UI进行接口测试</p>
                <p>• 查看系统状态和健康检查</p>
            </div>
        </div>
        
        <div>
            <a href="/swagger-ui/index.html" class="btn">📚 API文档</a>
            <a href="/actuator/health" class="btn">💚 系统状态</a>
        </div>
        
        <div class="timestamp">
            当前时间：<span th:text="${currentTime}">2024-01-01 12:00:00</span>
        </div>
    </div>
</body>
</html>
